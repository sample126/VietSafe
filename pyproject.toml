[project]
name = "vietsafe"
version = "2.0.0"
description = "VietSafe modular offline-capable browser frontend and stdlib Python backend"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpm = ["h5py>=3.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
